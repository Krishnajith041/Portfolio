<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0e"/>
      <stop offset="50%" stop-color="#12100e"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.45)"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.0)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="16"/>
  <rect width="798" height="448" x="1" y="1" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.5" rx="15"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" fill="#141416" rx="16"/>
  <circle cx="28" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <text x="400" y="26" fill="#a1a1aa" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">DATA ANALYTICS DASHBOARD • PANDAS &amp; NUMPY</text>

  <!-- Metrics row -->
  <g transform="translate(30, 60)">
    <!-- Card 1 -->
    <rect width="220" height="75" rx="10" fill="#18181b" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1"/>
    <text x="18" y="28" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500">PROCESSED ROWS</text>
    <text x="18" y="56" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="22" font-weight="700">128,450</text>
    <path d="M 160 50 Q 180 35 200 42" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <text x="175" y="28" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">+18.4%</text>

    <!-- Card 2 -->
    <rect x="245" width="230" height="75" rx="10" fill="#18181b" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1"/>
    <text x="263" y="28" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500">CORRELATION ACCURACY</text>
    <text x="263" y="56" fill="#f59e0b" font-family="'Outfit', sans-serif" font-size="22" font-weight="700">98.6%</text>
    <text x="420" y="28" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">r = 0.94</text>

    <!-- Card 3 -->
    <rect x="495" width="245" height="75" rx="10" fill="#18181b" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1"/>
    <text x="513" y="28" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500">DATA CLEANING EFFICIENCY</text>
    <text x="513" y="56" fill="#ffd700" font-family="'Outfit', sans-serif" font-size="22" font-weight="700">14.2 ms</text>
    <text x="670" y="28" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">OPTIMIZED</text>
  </g>

  <!-- Main Chart Area -->
  <g transform="translate(30, 150)">
    <rect width="465" height="265" rx="12" fill="#131316" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1"/>
    <text x="20" y="30" fill="#f4f4f6" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">Distribution &amp; Variance Trend</text>
    <text x="20" y="46" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">df.groupby('category').agg(['mean', 'std'])</text>

    <!-- Grid lines -->
    <line x1="20" y1="90" x2="445" y2="90" stroke="#27272a" stroke-dasharray="4"/>
    <line x1="20" y1="140" x2="445" y2="140" stroke="#27272a" stroke-dasharray="4"/>
    <line x1="20" y1="190" x2="445" y2="190" stroke="#27272a" stroke-dasharray="4"/>
    <line x1="20" y1="240" x2="445" y2="240" stroke="#27272a"/>

    <!-- Chart Fill -->
    <path d="M 30 220 Q 80 180 130 195 T 230 130 T 330 110 T 435 70 L 435 240 L 30 240 Z" fill="url(#chartGrad)"/>
    <!-- Line 1 -->
    <path d="M 30 220 Q 80 180 130 195 T 230 130 T 330 110 T 435 70" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Points with glow -->
    <circle cx="130" cy="195" r="4.5" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="230" cy="130" r="4.5" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="330" cy="110" r="4.5" fill="#ffd700" filter="url(#glow)"/>
    <circle cx="435" cy="70" r="5" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- Side Heatmap / Matrix Panel -->
  <g transform="translate(510, 150)">
    <rect width="260" height="265" rx="12" fill="#131316" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1"/>
    <text x="18" y="30" fill="#f4f4f6" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">Feature Correlation</text>
    <text x="18" y="46" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">NumPy Matrix Heatmap</text>

    <!-- Heatmap cells -->
    <rect x="20" y="65" width="48" height="42" rx="4" fill="#fbbf24" opacity="0.9"/>
    <text x="44" y="90" fill="#000" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1.00</text>

    <rect x="74" y="65" width="48" height="42" rx="4" fill="#f59e0b" opacity="0.6"/>
    <text x="98" y="90" fill="#fff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0.74</text>

    <rect x="128" y="65" width="48" height="42" rx="4" fill="#d97706" opacity="0.3"/>
    <text x="152" y="90" fill="#fff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0.31</text>

    <rect x="182" y="65" width="48" height="42" rx="4" fill="#f59e0b" opacity="0.8"/>
    <text x="206" y="90" fill="#000" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0.88</text>

    <rect x="20" y="113" width="48" height="42" rx="4" fill="#f59e0b" opacity="0.6"/>
    <text x="44" y="138" fill="#fff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0.74</text>

    <rect x="74" y="113" width="48" height="42" rx="4" fill="#fbbf24" opacity="0.9"/>
    <text x="98" y="138" fill="#000" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1.00</text>

    <rect x="128" y="113" width="48" height="42" rx="4" fill="#d97706" opacity="0.5"/>
    <text x="152" y="138" fill="#fff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0.52</text>

    <rect x="182" y="113" width="48" height="42" rx="4" fill="#d97706" opacity="0.2"/>
    <text x="206" y="138" fill="#fff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0.19</text>

    <rect x="20" y="161" width="48" height="42" rx="4" fill="#d97706" opacity="0.3"/>
    <text x="44" y="186" fill="#fff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0.31</text>

    <rect x="74" y="161" width="48" height="42" rx="4" fill="#d97706" opacity="0.5"/>
    <text x="98" y="186" fill="#fff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0.52</text>

    <rect x="128" y="161" width="48" height="42" rx="4" fill="#fbbf24" opacity="0.9"/>
    <text x="152" y="186" fill="#000" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1.00</text>

    <rect x="182" y="161" width="48" height="42" rx="4" fill="#f59e0b" opacity="0.7"/>
    <text x="206" y="186" fill="#fff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0.65</text>

    <!-- Pill badge -->
    <rect x="20" y="215" width="210" height="32" rx="16" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1"/>
    <text x="125" y="235" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">● High Statistical Significance</text>
  </g>
</svg>
