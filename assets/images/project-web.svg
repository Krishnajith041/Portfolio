<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080b"/>
      <stop offset="50%" stop-color="#11121a"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="brandGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ff7a00"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#webBg)" rx="16"/>
  <rect width="798" height="448" x="1" y="1" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5" rx="15"/>

  <!-- Ambient Glow -->
  <circle cx="680" cy="120" r="140" fill="rgba(245, 158, 11, 0.12)" filter="url(#softGlow)"/>
  <circle cx="150" cy="350" r="120" fill="rgba(255, 122, 0, 0.08)" filter="url(#softGlow)"/>

  <!-- Browser Chrome Header -->
  <rect x="0" y="0" width="800" height="44" fill="#13141c" rx="16"/>
  <circle cx="28" cy="22" r="5.5" fill="#ef4444" opacity="0.85"/>
  <circle cx="46" cy="22" r="5.5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="64" cy="22" r="5.5" fill="#10b981" opacity="0.85"/>
  
  <!-- URL bar -->
  <rect x="180" y="9" width="440" height="26" rx="13" fill="#1e202c" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
  <text x="400" y="26" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" text-anchor="middle">🔒 https://modern-web-app.dev/showcase</text>

  <!-- Navigation bar mockup inside browser -->
  <g transform="translate(30, 60)">
    <rect width="740" height="45" rx="10" fill="url(#glassCard)" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1"/>
    <!-- Logo -->
    <rect x="15" y="10" width="24" height="24" rx="6" fill="url(#brandGold)"/>
    <text x="27" y="27" fill="#000" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" text-anchor="middle">K</text>
    <text x="48" y="27" fill="#fff" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">MODERN WEB</text>
    
    <!-- Nav Links -->
    <text x="420" y="27" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Home</text>
    <text x="480" y="27" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Components</text>
    <text x="580" y="27" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Showcase</text>
    
    <!-- Button -->
    <rect x="650" y="9" width="75" height="27" rx="13" fill="url(#brandGold)"/>
    <text x="687" y="26" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Explore</text>
  </g>

  <!-- Hero Content Preview inside browser -->
  <g transform="translate(45, 125)">
    <!-- Left Hero Column -->
    <rect width="130" height="22" rx="11" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1"/>
    <text x="65" y="15" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚡ HTML5 • CSS3 • JS</text>

    <text x="0" y="60" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="26" font-weight="800">Responsive Web</text>
    <text x="0" y="92" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="26" font-weight="800">Architecture</text>
    <text x="0" y="125" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Interactive glassmorphism UI system with dynamic CSS variables,</text>
    <text x="0" y="145" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">modern flex &amp; grid layouts, and fluid micro-animations.</text>

    <!-- Buttons -->
    <rect x="0" y="170" width="130" height="38" rx="8" fill="url(#brandGold)"/>
    <text x="65" y="194" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Live Demo →</text>

    <rect x="145" y="170" width="120" height="38" rx="8" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <text x="205" y="194" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Source Code</text>

    <!-- Metrics -->
    <g transform="translate(0, 235)">
      <text x="0" y="20" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">100%</text>
      <text x="0" y="36" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">RESPONSIVE</text>

      <text x="100" y="20" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">&lt; 1.0s</text>
      <text x="100" y="36" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">LOAD SPEED</text>

      <text x="200" y="20" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">A+</text>
      <text x="200" y="36" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">ACCESSIBILITY</text>
    </g>
  </g>

  <!-- Right Interactive Mockup Cards inside browser -->
  <g transform="translate(480, 130)">
    <!-- Card 1 -->
    <rect width="280" height="120" rx="14" fill="url(#glassCard)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.2"/>
    <circle cx="35" cy="35" r="18" fill="rgba(245, 158, 11, 0.2)"/>
    <path d="M 28 35 L 33 40 L 43 30" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <text x="65" y="32" fill="#fff" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">Dynamic Glass Layout</text>
    <text x="65" y="48" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">CSS Backdrop Filter &amp; Blur</text>
    
    <!-- Code snippet pill -->
    <rect x="20" y="70" width="240" height="34" rx="6" fill="#0c0d12"/>
    <text x="32" y="91" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="10">backdrop-filter: blur(16px);</text>

    <!-- Card 2 -->
    <g transform="translate(0, 135)">
      <rect width="280" height="135" rx="14" fill="url(#glassCard)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.2"/>
      <circle cx="35" cy="35" r="18" fill="rgba(245, 158, 11, 0.2)"/>
      <text x="35" y="40" fill="#fbbf24" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
      <text x="65" y="32" fill="#fff" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">DOM Event Handling</text>
      <text x="65" y="48" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Vanilla JavaScript Engine</text>

      <rect x="20" y="70" width="240" height="45" rx="6" fill="#0c0d12"/>
      <text x="32" y="88" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9.5">btn.addEventListener('click', () =&gt; {</text>
      <text x="44" y="103" fill="#10b981" font-family="'Fira Code', monospace" font-size="9.5">  triggerSmoothScroll('#contact');</text>
    </g>
  </g>
</svg>
